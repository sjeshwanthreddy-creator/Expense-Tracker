<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="game-card">
            <h1>🎯 Number Guessing Game</h1>
            <p class="subtitle">I'm thinking of a number between 1 and 100</p>

            <div class="game-content">
                <div class="input-group">
                    <input 
                        type="number" 
                        id="guessInput" 
                        min="1" 
                        max="100" 
                        placeholder="Enter your guess..." 
                        autocomplete="off"
                    >
                    <button id="submitBtn" class="btn btn-primary">Submit Guess</button>
                </div>

                <div class="feedback-section">
                    <div id="feedback" class="feedback-message"></div>
                </div>

                <div class="stats-section">
                    <div class="stat">
                        <span class="stat-label">Attempts:</span>
                        <span id="attempts" class="stat-value">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Status:</span>
                        <span id="status" class="stat-value status-playing">🎮 Playing</span>
                    </div>
                </div>

                <div class="guesses-section">
                    <h3>Your Guesses:</h3>
                    <div id="guessesList" class="guesses-list">
                        <p class="no-guesses">No guesses yet</p>
                    </div>
                </div>

                <button id="resetBtn" class="btn btn-secondary">🔄 New Game</button>
            </div>

            <div id="winModal" class="modal hidden">
                <div class="modal-content">
                    <h2>🎉 Congratulations!</h2>
                    <p id="winMessage"></p>
                    <button id="playAgainBtn" class="btn btn-primary">Play Again</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
